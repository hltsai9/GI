# Publishes the read-only demo (the web page with recorded API responses) to GitHub Pages.
# The web page needs no build: the files in frontend/ are published as they are, with config.js
# switched to demo mode. The recorded responses live in frontend/demo-data; refresh them with
#   cd backend && python -m gi.cli.demo && python -m gi.cli.export_demo
name: Demo on GitHub Pages

on:
  push:
    branches: [main, claude/admiring-mayer-hd253i]
    paths: ['frontend/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the device detection
        run: node --test frontend/tests/device.test.mjs frontend/tests/modules.test.mjs
      - name: Prepare the demo site
        run: |
          mkdir _site
          cp -r frontend/index.html frontend/css frontend/fonts frontend/icons frontend/js frontend/demo-data _site/
          echo 'window.GI_CONFIG = { demo: true };' > _site/config.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
