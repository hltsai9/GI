# GI on Docker: one app image (web page + API + import) and MariaDB.
# Usage and settings: docs/DEPLOYMENT_SOP.md. Settings come from deploy/.env (copy of .env.example).
name: gi

services:
  mariadb:
    # Included when COMPOSE_PROFILES contains "db" (the default in .env.example).
    # Leave it out to use an existing MariaDB server and set MARIADB_URL instead.
    profiles: [db]
    image: ${MARIADB_IMAGE:-mariadb:11.4}
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: gi
      MARIADB_USER: gi
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+00:00"]
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    build:
      context: ..
      dockerfile: Dockerfile
      network: ${BUILD_NETWORK:-default}
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
      secrets: [company_ca]
    image: ${IMAGE_PREFIX:-gi}:${GI_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
        required: false
    ports:
      - "${HTTP_PORT:-8080}:8000"
    environment:
      MARIADB_URL: ${MARIADB_URL:-mysql://gi:${DB_PASSWORD}@mariadb:3306/gi}
      # Or separate settings (used when MARIADB_HOST is set); the password needs no URL-encoding:
      MARIADB_HOST: ${MARIADB_HOST:-}
      MARIADB_PORT: ${MARIADB_PORT:-3306}
      MARIADB_USER: ${MARIADB_USER:-gi}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-gi}
      ISSUE_SOURCE: ${ISSUE_SOURCE:-mock}
      ORACLE_CONNECT_STRING: ${ORACLE_CONNECT_STRING:-}
      ORACLE_USER: ${ORACLE_USER:-}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-}
      ORACLE_ISSUE_TABLE: ${ORACLE_ISSUE_TABLE:-}
      ORACLE_BARCODE_MASTER_TABLE: ${ORACLE_BARCODE_MASTER_TABLE:-}
      ORACLE_POLL_SECONDS: ${ORACLE_POLL_SECONDS:-300}
      ORACLE_LOOKBACK_HOURS: ${ORACLE_LOOKBACK_HOURS:-24}
      ORACLE_MAX_ROWS: ${ORACLE_MAX_ROWS:-5000}
      ORACLE_SWEEP_DAYS: ${ORACLE_SWEEP_DAYS:-3}
      ORACLE_TIME_TOLERANCE_MINUTES: ${ORACLE_TIME_TOLERANCE_MINUTES:-10}
      ORACLE_BACKFILL_FROM: ${ORACLE_BACKFILL_FROM:-}
      SITE_TIMEZONE: ${SITE_TIMEZONE:-America/Phoenix}
      ORACLE_INSERT_TIME_ZONE: ${ORACLE_INSERT_TIME_ZONE:-America/Phoenix}
      DEV_AUTH: ${DEV_AUTH:-true}
      ADMIN_PASSCODE: ${ADMIN_PASSCODE:-}
    # Mock Oracle data (ISSUE_SOURCE=mock) is generated in memory, the same on every container.
    # Several app containers are safe: only the one holding a MariaDB lock runs the import.

secrets:
  # Company root certificate (PEM) for TLS-inspecting proxies; empty file = none.
  company_ca:
    file: ${COMPANY_CA_FILE:-./no-company-ca.pem}

volumes:
  mariadb-data:
