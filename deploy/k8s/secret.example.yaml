# EXAMPLE ONLY — do not put real passwords in git.
# The pipeline creates this Secret from the secret variable GI_DB_PASSWORD (deploy/azure-pipelines.yml).
# To create it by hand instead:
#   kubectl -n <namespace> create secret generic gi-secrets --from-literal=MARIADB_PASSWORD='<password>'
apiVersion: v1
kind: Secret
metadata:
  name: gi-secrets
  labels: { app.kubernetes.io/name: gi }
type: Opaque
stringData:
  MARIADB_PASSWORD: "<set by the pipeline>"
  # ORACLE_PASSWORD: "<later, when ISSUE_SOURCE=oracle>"
