server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # API → backend container. The name is looked up per request (Docker's DNS at 127.0.0.11),
  # so nginx also starts when there is no backend, e.g. for the frontend-only demo.
  resolver 127.0.0.11 valid=30s ipv6=off;
  set $backend http://backend:3000;
  location /api/ {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location = /healthz { access_log off; return 200 "ok\n"; }

  # Built assets have content hashes in their names: cache them for a long time.
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }

  # Single-page app: always serve index.html (never cached, so new releases show up at once).
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
